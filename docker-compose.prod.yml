# ==============================================================================
# MedAI Microservices - Production Environment
# ==============================================================================
# Docker Compose configuration for production deployment with microservices.
# Uses MongoDB Atlas by default (cloud database).
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up --build
#
# For local MongoDB in production (testing):
#   docker-compose -f docker-compose.prod.yml -f docker-compose.prod.localdb.yml up
#
# Services:
#   - gateway: API Gateway (FastAPI, no ML dependencies)
#   - ner-transformer: Transformer NER Service (PyTorch + HuggingFace)
#   - ner-bilstm: BiLSTM NER Service (Keras v3 + TensorFlow backend)
#   - ner-bilstm-crf: BiLSTM-CRF NER Service (TensorFlow)
#   - ner-crf: CRF NER Service (sklearn-crfsuite)
#   - ner-llm: LLM NER Service (Anthropic/OpenAI clients)
#   - mongo: MongoDB database (disabled by default, enable with override)

version: "3.8"

services:
  # ===========================================================================
  # API Gateway
  # ===========================================================================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: medai-gateway-prod
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    environment:
      # Service URLs (Docker Compose service names)
      - NER_TRANSFORMER_URL=http://ner-transformer:8001
      - NER_LSTM_URL=http://ner-bilstm:8002
      - NER_LSTM_CRF_URL=http://ner-bilstm-crf:8005
      - NER_LLM_URL=http://ner-llm:8003
      - NER_CRF_URL=http://ner-crf:8004

      # Logging (production level)
      - LOG_LEVEL=warning
    depends_on:
      - ner-transformer
      - ner-bilstm
      - ner-bilstm-crf
      - ner-crf
      - ner-llm
    networks:
      - medai-network
    restart: unless-stopped

  # ===========================================================================
  # NER Transformer Service (RoBERTa ONLY - Fixed for experiments)
  # ===========================================================================
  ner-transformer:
    build:
      context: .
      dockerfile: services/ner-transformer/Dockerfile
    container_name: medai-ner-transformer-prod
    env_file:
      - .env.prod
    environment:
      - MODEL_VARIANT=roberta
      - LOG_LEVEL=warning
    volumes:
      # Cache Hugging Face models to avoid re-downloading
      - transformer_cache:/root/.cache/huggingface
      # Mount shared schemas
      - ./shared:/app/shared:ro
    networks:
      - medai-network
    restart: unless-stopped
    # No published ports - internal network only

  # ===========================================================================
  # NER BiLSTM Service (no CRF)
  # ===========================================================================
  ner-bilstm:
    build:
      context: .
      dockerfile: services/ner-bilstm/Dockerfile
    container_name: medai-ner-bilstm-prod
    env_file:
      - .env.prod
    environment:
      - MODEL_DIR=/app/models/model
      - LOG_LEVEL=warning
    volumes:
      # Mount shared schemas
      - ./shared:/app/shared:ro
    networks:
      - medai-network
    restart: unless-stopped
    # No published ports - internal network only

  # ===========================================================================
  # NER BiLSTM-CRF Service (BiLSTM-CRF)
  # ===========================================================================
  ner-bilstm-crf:
    build:
      context: .
      dockerfile: services/ner-bilstm-crf/Dockerfile
    container_name: medai-ner-bilstm-crf-prod
    env_file:
      - .env.prod
    environment:
      - MODEL_DIR=/app/models/model
      - LOG_LEVEL=warning
    volumes:
      # Mount shared schemas
      - ./shared:/app/shared:ro
    networks:
      - medai-network
    restart: unless-stopped
    # No published ports - internal network only

  # ===========================================================================
  # NER CRF Service (sklearn-crfsuite)
  # ===========================================================================
  ner-crf:
    build:
      context: .
      dockerfile: services/ner-crf/Dockerfile
    container_name: medai-ner-crf-prod
    env_file:
      - .env.prod
    environment:
      - MODEL_DIR=/app/models/model
      - LOG_LEVEL=warning
    volumes:
      # Mount shared schemas
      - ./shared:/app/shared:ro
    networks:
      - medai-network
    restart: unless-stopped
    # No published ports - internal network only

  # ===========================================================================
  # NER LLM Service (GPT ONLY - Fixed for experiments)
  # ===========================================================================
  ner-llm:
    build:
      context: .
      dockerfile: services/ner-llm/Dockerfile
    container_name: medai-ner-llm-prod
    env_file:
      - .env.prod
    environment:
      - LLM_PROVIDER=gpt
      - LOG_LEVEL=warning
    volumes:
      # Mount shared schemas
      - ./shared:/app/shared:ro
    networks:
      - medai-network
    restart: unless-stopped
    # No published ports - internal network only

  # ===========================================================================
  # MongoDB Database (DISABLED by default - use Atlas)
  # ===========================================================================
  # To enable local MongoDB, use docker-compose.prod.localdb.yml override:
  #   docker-compose -f docker-compose.prod.yml -f docker-compose.prod.localdb.yml up

# =============================================================================
# Networks
# =============================================================================
networks:
  medai-network:
    driver: bridge
    name: medai-microservices-prod

# =============================================================================
# Volumes
# =============================================================================
volumes:
  transformer_cache:
    driver: local
    name: medai-transformer-cache-prod
